<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="panel">
      <p class="eyebrow">Daily Planner</p>
      <h1>To-Do List</h1>
      <form id="task-form" class="task-form">
        <input id="task-input" type="text" placeholder="Add a new task" autocomplete="off" required>
        <button type="submit">Add</button>
      </form>

      <div class="filters" aria-label="Task filters">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="active" type="button">Active</button>
        <button class="filter" data-filter="completed" type="button">Completed</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add one to get started.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
